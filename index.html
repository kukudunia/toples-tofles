<style>
  :root{
    --night-0:#050b12;
    --night-1:#0a1725;
    --snow:#eef5fb;
    --frost:#c7dcea;
    --ice:#93b8d2;
    --berry:#a84a55;
    --paper:#faf6ec;
    --ink:#2b2a26;
    --ink-soft:#4a4740;
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:"Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
    --hand:"Caveat", "Segoe Script", cursive;
  }

  *{ box-sizing:border-box; }

  html{ height:100%; -webkit-text-size-adjust:100%; overflow-x:hidden; }

  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(70% 45% at 50% -8%, #2a5a7a 0%, rgba(42,90,122,0) 62%),
      radial-gradient(90% 60% at 82% 8%, rgba(120,170,205,.20) 0%, rgba(120,170,205,0) 58%),
      radial-gradient(120% 90% at 50% 105%, #081420 0%, #0a1725 42%, #050b12 100%);
    background-attachment:fixed;
    color:var(--snow);
    font-family:var(--sans);
    font-weight:300;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #snowfield{
    position:fixed; inset:0;
    pointer-events:none; z-index:2;
    transition:opacity 1.1s ease;
  }
  #snowfield.is-hushed{ opacity:.18; }

  .grain{
    position:fixed; inset:0; z-index:3; pointer-events:none;
    opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.9'/></svg>");
  }

  .moon{
    position:fixed; top:-110px; right:4vw; width:260px; height:260px;
    border-radius:50%; z-index:1; pointer-events:none;
    background:radial-gradient(circle at 38% 36%, #fdfefe 0%, #e7f1f8 46%, rgba(220,236,246,.22) 68%, rgba(220,236,246,0) 72%);
    opacity:.34;
    box-shadow:0 0 140px 50px rgba(200,226,242,.12);
  }

  .treeline{
    position:fixed; left:0; right:0; bottom:0; height:34vh;
    z-index:0; pointer-events:none; opacity:.45;
  }
  .treeline svg{ width:100%; height:100%; display:block; }

  .stage{
    position:relative; z-index:4;
    min-height:100vh;
    min-height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  }

  .scene{
    position:relative;
    width:min(520px, 100%);
    height:clamp(370px, 54vh, 480px);
    display:flex; align-items:flex-end; justify-content:center;
  }

  .ground{
    position:absolute; left:0; right:0; bottom:-14px; height:120px;
    background:radial-gradient(60% 100% at 50% 100%, rgba(238,245,251,.26) 0%, rgba(238,245,251,.08) 44%, rgba(238,245,251,0) 74%);
    filter:blur(2px);
    pointer-events:none;
  }

  .jar{
    position:relative;
    width:clamp(184px, 43vw, 224px);
    height:clamp(266px, 39vh, 306px);
    border:none; background:none; padding:0;
    cursor:pointer;
    z-index:3;
    animation:breathe 11s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .jar:focus{ outline:none; }
  .jar:focus-visible{
    outline:1px dashed rgba(199,220,234,.75);
    outline-offset:16px;
    border-radius:32px;
  }

  @keyframes breathe{
    0%,100%{ transform:translateY(0) rotate(-.3deg); }
    50%    { transform:translateY(-5px) rotate(.3deg); }
  }

  .jar__lid{
    position:absolute; top:-2px; left:50%; translate:-50% 0;
    width:66%; height:44px;
    z-index:6;
    transition:transform .9s cubic-bezier(.34,1.42,.64,1);
    transform-origin:50% 100%;
  }
  .jar__lid .cork{
    position:absolute; left:50%; translate:-50% 0; bottom:0;
    width:100%; height:30px;
    border-radius:7px 7px 4px 4px;
    background:linear-gradient(180deg, #b78a5e 0%, #9d7349 38%, #7d5a37 100%);
    box-shadow:inset 0 1px 0 rgba(255,236,214,.45), 0 3px 10px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .jar__lid .cork::after{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(61,38,20,.55) 1px, transparent 1.4px);
    background-size:7px 7px;
    opacity:.5;
  }
  .jar__lid .rim{
    position:absolute; left:50%; translate:-50% 0; bottom:-7px;
    width:112%; height:13px;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(214,233,245,.5));
    box-shadow:0 2px 8px rgba(0,0,0,.25), inset 0 -1px 2px rgba(120,160,185,.5);
  }
  .jar__twine{
    position:absolute; left:50%; translate:-50% 0; bottom:-16px;
    width:118%; height:9px;
    border-radius:999px;
    background:linear-gradient(90deg, #7d5a37, #a37c50 40%, #7d5a37);
    opacity:.9;
    z-index:5;
  }

  .jar__tag{
    position:absolute; right:-16px; bottom:-34px;
    padding:6px 10px;
    background:var(--paper);
    color:#6b5a41;
    font-family:var(--hand);
    font-size:15px; line-height:1;
    border-radius:2px;
    box-shadow:0 3px 9px rgba(0,0,0,.28);
    z-index:5;
    white-space:nowrap;
    animation:tagSway 7s ease-in-out infinite;
    transform-origin:50% -6px;
  }
  .jar__tag::before{
    content:"";
    position:absolute; left:8px; top:-5px;
    width:1px; height:7px; background:rgba(120,95,65,.6);
  }
  @keyframes tagSway{
    0%,100%{ transform:rotate(-8deg); }
    50%    { transform:rotate(-4.5deg); }
  }

  .jar__body{
    position:absolute; inset:22px 0 0 0;
    border-radius:26px 26px 44px 44px;
    overflow:hidden;
    background:linear-gradient(150deg, rgba(255,255,255,.28) 0%, rgba(203,225,240,.11) 34%, rgba(255,255,255,.04) 62%, rgba(226,241,250,.22) 100%);
    border:1.5px solid rgba(228,242,251,.5);
    box-shadow:
      inset 0 0 34px rgba(255,255,255,.28),
      inset 14px 0 26px rgba(255,255,255,.14),
      inset -16px -20px 34px rgba(20,48,70,.36),
      0 26px 50px -14px rgba(0,0,0,.6),
      0 0 60px rgba(150,196,226,.1);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
  }
  .jar__body::before{
    content:"";
    position:absolute; top:14px; left:13%; width:11px; height:52%;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0));
    opacity:.5;
  }
  .jar__body::after{
    content:"";
    position:absolute; bottom:16%; right:9%; width:5px; height:26%;
    border-radius:999px;
    background:linear-gradient(0deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    opacity:.36;
  }

  .jar__snowcap{
    position:absolute; left:0; right:0; top:0; height:26px;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0));
    pointer-events:none;
  }

  .jar__floor{
    position:absolute; left:0; right:0; bottom:0; height:44px;
    background:radial-gradient(70% 130% at 50% 100%, rgba(240,248,253,.5) 0%, rgba(220,238,248,.2) 55%, rgba(220,238,248,0) 80%);
    pointer-events:none;
  }

  .memstar{
    position:absolute;
    width:3px; height:3px; border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px 1px rgba(214,238,252,.9);
    animation:starIn .9s ease-out backwards, twinkle 4.6s ease-in-out infinite;
  }
  @keyframes starIn{
    from{ opacity:0; transform:scale(0); }
    to  { opacity:.85; transform:scale(1); }
  }
  @keyframes twinkle{
    0%,100%{ opacity:.2; }
    50%    { opacity:.85; }
  }

  .jar__letter{
    position:absolute; left:50%; bottom:26px; translate:-50% 0;
    width:92px; height:114px;
    background:linear-gradient(100deg, #efe6d2 0%, #fdf9ee 30%, #f7f0df 62%, #e8ddc6 100%);
    border-radius:4px;
    transform:rotate(-7deg);
    box-shadow:0 12px 22px rgba(0,0,0,.4), inset 0 0 0 1px rgba(160,140,110,.28);
    z-index:2;
    transition:transform .75s cubic-bezier(.34,1.4,.64,1), opacity .5s ease;
  }
  .jar__letter::before,
  .jar__letter::after{
    content:"";
    position:absolute; left:0; right:0; height:7px;
    background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(226,214,192,.9));
    border-radius:4px;
  }
  .jar__letter::before{ top:-3px; box-shadow:0 1px 3px rgba(0,0,0,.16); }
  .jar__letter::after { bottom:-3px; box-shadow:0 -1px 3px rgba(0,0,0,.12); }

  .jar__ribbon{
    position:absolute; left:0; right:0; top:48%; height:13px;
    background:linear-gradient(180deg, var(--berry), #8d3c46);
    box-shadow:0 2px 5px rgba(0,0,0,.3);
  }
  .jar__ribbon::after{
    content:"";
    position:absolute; left:50%; top:50%; translate:-50% -50%;
    width:20px; height:20px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #c26872, #8d3c46);
    box-shadow:0 1px 3px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,220,220,.25);
  }

  .scene.is-open .jar__lid{ transform:translate(16px,-80px) rotate(19deg); }
  .scene.is-open .jar__letter{
    transform:translateY(-158px) rotate(4deg) scale(1.05);
    opacity:0;
  }

  .snowman{
    position:absolute; right:clamp(-14px, 1.5vw, 6px); bottom:2px;
    width:clamp(110px, 21vw, 152px);
    z-index:2;
    filter:drop-shadow(0 18px 26px rgba(0,0,0,.42));
    animation:bob 13s ease-in-out infinite;
    pointer-events:none;
  }
  .snowman::after{
    content:"";
    position:absolute; left:8%; right:8%; bottom:-2px; height:14px;
    border-radius:50%;
    background:radial-gradient(50% 100% at 50% 50%, rgba(4,11,18,.62) 0%, rgba(4,11,18,0) 72%);
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-.4deg); }
    50%    { transform:translateY(-4px) rotate(.4deg); }
  }

  .hint{
    margin:28px 0 0;
    display:flex; flex-direction:column; align-items:center; gap:9px;
    color:rgba(215,232,243,.72);
    font-size:11.5px; letter-spacing:.22em; text-transform:uppercase;
    transition:opacity .8s ease;
  }
  .hint.is-gone{ opacity:0; }
  .hint__line{
    width:1px; height:22px;
    background:linear-gradient(180deg, rgba(199,220,234,.45), rgba(199,220,234,0));
  }

  .overlay{
    position:fixed; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(14px,3vw,34px);
    background:rgba(4,10,17,.66);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
  }
  .overlay.is-visible{ opacity:1; pointer-events:auto; }

  .scrollwrap{
    display:flex; flex-direction:column; align-items:center; gap:22px;
    transition:opacity .45s ease, transform .55s cubic-bezier(.3,1.2,.5,1);
  }
  .overlay.phase-letter .scrollwrap{
    opacity:0; transform:scale(.82) translateY(-30px);
    pointer-events:none;
    transition:opacity .35s ease, transform .45s ease;
  }

  .scroll{
    position:relative;
    width:clamp(86px, 22vw, 108px);
    height:clamp(230px, 40vh, 290px);
    border:none; background:none; padding:0;
    cursor:pointer;
    animation:scrollFloat 6.5s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    filter:drop-shadow(0 24px 40px rgba(0,0,0,.6));
  }
  .scroll:focus{ outline:none; }
  .scroll:focus-visible{ outline:1px dashed rgba(199,220,234,.8); outline-offset:12px; border-radius:6px; }
  @keyframes scrollFloat{
    0%,100%{ transform:translateY(0) rotate(-1.4deg); }
    50%    { transform:translateY(-9px) rotate(1.4deg); }
  }

  .scroll__paper{
    position:absolute; inset:0;
    border-radius:7px;
    background:linear-gradient(100deg, #e6dbc4 0%, #fdf9ee 22%, #f8f1e0 55%, #e9dfc9 88%, #d8cbaf 100%);
    box-shadow:inset 0 0 0 1px rgba(150,128,96,.3), inset 12px 0 18px -12px rgba(120,95,60,.5);
  }
  .scroll__roll{
    position:absolute; left:-6%; right:-6%; height:16px;
    border-radius:999px;
    background:linear-gradient(180deg, #fdfaf1, #ddd0b4 60%, #c2b191);
    box-shadow:0 2px 5px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.85);
  }
  .scroll__roll--top{ top:-9px; }
  .scroll__roll--bot{ bottom:-9px; }

  .scroll__ribbon{
    position:absolute; left:-5%; right:-5%; top:50%; translate:0 -50%;
    height:18px;
    background:linear-gradient(180deg, #b2535e, #8a3944);
    box-shadow:0 3px 8px rgba(0,0,0,.35);
    border-radius:2px;
  }
  .scroll__ribbon::after{
    content:"";
    position:absolute; left:50%; top:50%; translate:-50% -50%;
    width:24px; height:24px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #c9717a, #8a3944);
    box-shadow:0 2px 5px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,215,215,.22);
  }

  .scroll__hint{
    margin:0;
    font-size:11px; letter-spacing:.24em; text-transform:uppercase;
    color:rgba(215,232,243,.78);
    animation:pulseHint 3.4s ease-in-out infinite;
  }
  @keyframes pulseHint{
    0%,100%{ opacity:.5; }
    50%    { opacity:.95; }
  }

  .letter{
    position:absolute;
    width:min(540px, calc(100vw - 28px));
    max-height:90vh;
    max-height:90dvh;
    overflow-y:auto;
    overscroll-behavior:contain;
    background-color:var(--paper);
    background-image:
      radial-gradient(rgba(160,138,104,.2) .55px, transparent .55px),
      radial-gradient(rgba(160,138,104,.1) .55px, transparent .55px);
    background-size:4px 4px, 7px 7px;
    background-position:0 0, 2px 3px;
    color:var(--ink);
    border-radius:3px;
    padding:clamp(28px,5vw,46px) clamp(24px,5vw,46px) 30px;
    box-shadow:0 40px 90px -22px rgba(0,0,0,.78), 0 0 0 1px rgba(120,100,70,.16), inset 0 0 70px rgba(190,168,130,.14);
    clip-path:inset(0 0 100% 0);
    opacity:0;
    transform:translateY(-8px);
    transition:clip-path .95s cubic-bezier(.22,.86,.24,1), opacity .5s ease, transform .6s ease;
    pointer-events:none;
  }
  .overlay.phase-letter .letter{
    clip-path:inset(0 0 0 0);
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .letter::-webkit-scrollbar{ width:5px; }
  .letter::-webkit-scrollbar-thumb{ background:rgba(120,100,70,.26); border-radius:9px; }

  .letter__close{
    position:absolute; top:10px; right:10px;
    width:44px; height:44px;
    border:none; background:transparent;
    color:#6b5a41; border-radius:50%;
    cursor:pointer; font-size:16px; line-height:1;
    display:grid; place-items:center;
    transition:background .2s ease;
  }
  .letter__close:hover{ background:rgba(120,100,70,.1); }

  .letter__stamp{
    position:absolute; top:18px; right:64px;
    width:44px; height:52px;
    border:1px dashed rgba(150,110,80,.45);
    border-radius:2px;
    display:grid; place-items:center;
    transform:rotate(4deg);
    color:rgba(150,110,80,.6);
  }
  .letter__stamp svg{ width:20px; height:20px; }

  .letter__meta{
    font-family:var(--sans);
    font-size:9.5px; letter-spacing:.28em; text-transform:uppercase;
    color:rgba(120,100,70,.65);
    margin:0 0 16px;
  }

  .letter__greet{
    font-family:var(--hand);
    font-weight:600;
    font-size:clamp(32px,6vw,44px);
    line-height:1.05;
    margin:0 0 4px;
    color:var(--ink);
  }

  .rule{
    width:40px; height:1px;
    background:rgba(120,100,70,.38);
    margin:14px 0 26px;
  }

  .letter__body p{
    font-family:var(--serif);
    font-weight:300;
    font-size:clamp(16px,2.4vw,17.5px);
    line-height:1.85;
    margin:0 0 22px;
    color:var(--ink-soft);
  }

  .letter__pull{
    font-family:var(--serif);
    font-style:italic;
    font-weight:400;
    font-size:clamp(22px,3.8vw,28px);
    line-height:1.55;
    color:var(--ink);
    margin:44px 0 46px;
    padding:2px 0 2px 20px;
    border-left:2px solid rgba(168,74,85,.55);
  }
  .letter__pull:empty{ display:none; }

  .letter__sign{
    margin-top:34px;
    text-align:right;
  }
  .letter__date{
    display:block;
    font-family:var(--sans);
    font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(120,100,70,.65);
    margin-bottom:10px;
  }
  .letter__sign strong{
    font-family:var(--hand);
    font-weight:600;
    font-size:clamp(23px,3.4vw,28px);
    color:#3a3428;
    line-height:1.2;
  }

  /* stiker foto kucing yang ditempel di surat */
  /* stiker emoji die-cut, ditempel setelah kalimat puncak */
  .emoji-sticker{
    display:flex;
    justify-content:flex-end;
    margin:-30px 4px 0 0;
    position:relative;
    z-index:2;
    pointer-events:none;
  }
  .emoji-sticker img{
    width:clamp(40px, 6.6vw, 46px);
    height:auto;
    transform:rotate(8deg);
    filter:drop-shadow(0 1px 1px rgba(60,45,25,.28)) drop-shadow(0 4px 7px rgba(60,45,25,.22));
    transition:transform .35s cubic-bezier(.2,.9,.3,1);
  }
  .emoji-sticker img:hover{ transform:rotate(4deg) scale(1.06); }

  .sticker{
    display:flex; align-items:flex-end; justify-content:flex-end;
    gap:10px;
    margin:36px 0 10px;
    padding-right:6px;
  }
  .sticker__cap{
    font-family:var(--hand);
    font-weight:400;
    font-size:17.5px;
    font-weight:600;
    line-height:1.25;
    color:rgba(104,86,60,.9);
    text-align:right;
    max-width:150px;
    transform:rotate(-2deg);
    padding-bottom:14px;
  }
  .sticker__photo{
    position:relative;
    flex:none;
    transform:rotate(-6deg);
    transition:transform .35s cubic-bezier(.2,.9,.3,1);
    filter:drop-shadow(0 1px 1px rgba(60,45,25,.34)) drop-shadow(0 5px 9px rgba(60,45,25,.26));
  }
  .sticker__photo:hover{ transform:rotate(-2.5deg) scale(1.03); }

  .sticker__img{
    display:block;
    width:clamp(96px, 17vw, 116px);
    aspect-ratio:140 / 162;
    object-fit:cover;
    background:#fff;
    padding:5px 5px 14px;
    border-radius:1.5px;
    box-shadow:inset 0 0 0 1px rgba(120,100,70,.13);
    filter:saturate(.92) contrast(1.02);
  }

  /* selotip kertas di sudut atas */
  .sticker__tape{
    position:absolute; top:-9px; left:-13px;
    width:46px; height:17px;
    background:rgba(226,212,182,.82);
    border-left:1px dashed rgba(255,255,255,.55);
    border-right:1px dashed rgba(255,255,255,.55);
    transform:rotate(-32deg);
    box-shadow:0 1px 3px rgba(60,45,25,.2);
    pointer-events:none;
  }

  .letter__actions{
    display:flex; align-items:center; gap:14px;
    margin-top:26px; padding-top:20px;
    border-top:1px solid rgba(120,100,70,.2);
    flex-wrap:wrap;
  }

  .btn-quiet{
    border:none; background:none; cursor:pointer;
    min-height:44px; padding:0 2px;
    font-family:var(--sans); font-size:11px; letter-spacing:.16em;
    text-transform:uppercase;
    color:rgba(120,100,70,.72);
    transition:color .2s ease;
  }
  .btn-quiet:hover{ color:#3a3428; }

  .btn-primary{
    margin-left:auto;
    border:none; cursor:pointer;
    min-height:46px; padding:0 22px;
    background:#26303a; color:#f4f8fb;
    font-family:var(--sans); font-size:11px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase;
    border-radius:999px;
    transition:background .22s ease, transform .22s ease;
  }
  .btn-primary:hover{ background:#101a22; }
  .btn-primary:active{ transform:translateY(1px); }

  .drawer{
    position:fixed; inset:0; z-index:50;
    display:flex; justify-content:flex-end;
    background:rgba(4,10,17,.6);
    backdrop-filter:blur(6px);
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
    overflow:hidden;
  }
  .drawer.is-open{ opacity:1; pointer-events:auto; }

  .drawer__panel{
    width:min(440px, 100%);
    height:100%;
    background:#f6f2e8;
    color:var(--ink);
    padding:26px 24px calc(30px + env(safe-area-inset-bottom));
    overflow-y:auto;
    transform:translateX(28px);
    transition:transform .42s cubic-bezier(.22,.9,.28,1);
    border-left:1px solid rgba(255,255,255,.5);
    box-shadow:-40px 0 90px rgba(0,0,0,.55);
  }
  .drawer.is-open .drawer__panel{ transform:translateX(0); }

  .drawer__head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  .drawer__title{
    font-family:var(--serif); font-weight:500;
    font-size:20px; margin:0 0 5px;
  }
  .drawer__note{
    font-size:12px; line-height:1.6;
    color:rgba(60,52,38,.62);
    margin:0 0 22px;
  }
  .drawer__close{
    flex:none;
    width:44px; height:44px; margin:-8px -8px 0 0;
    border:none; cursor:pointer;
    background:transparent; color:#6b5a41;
    border-radius:50%; font-size:15px; line-height:1;
    display:grid; place-items:center;
    transition:background .2s ease;
  }
  .drawer__close:hover{ background:rgba(120,100,70,.12); }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:9.5px; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(60,52,38,.6);
    margin-bottom:7px;
  }
  .field input,
  .field textarea{
    width:100%;
    min-height:44px;
    font-family:var(--sans); font-size:14px; line-height:1.55;
    color:var(--ink);
    background:#fffdf7;
    border:1px solid rgba(120,100,70,.25);
    border-radius:4px;
    padding:11px 12px;
    resize:vertical;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus,
  .field textarea:focus{
    outline:none;
    border-color:rgba(80,70,50,.6);
    box-shadow:0 0 0 3px rgba(120,100,70,.09);
  }
  .field textarea#inBody{ min-height:190px; line-height:1.62; overflow:hidden; }

  .drawer__actions{
    display:flex; align-items:center; gap:12px;
    margin-top:28px; padding-top:20px;
    border-top:1px solid rgba(120,100,70,.18);
  }
  .drawer__actions .spacer{ flex:1; }
  .drawer__actions .sep{ width:1px; height:14px; background:rgba(120,100,70,.24); flex:none; }

  .btn-ghost{
    border:none; cursor:pointer; background:none;
    color:rgba(60,52,38,.68);
    font-family:var(--sans); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase;
    min-height:44px; padding:0 4px;
  }
  .btn-ghost:hover{ color:var(--ink); }

  .toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); translate:-50% 0;
    z-index:60;
    background:rgba(10,22,33,.95);
    border:1px solid rgba(199,220,234,.18);
    color:rgba(238,245,251,.92);
    font-size:11.5px; letter-spacing:.08em;
    padding:12px 20px; border-radius:999px;
    box-shadow:0 16px 34px rgba(0,0,0,.45);
    opacity:0; pointer-events:none;
    transform:translateY(10px);
    transition:opacity .3s ease, transform .3s ease;
    max-width:calc(100vw - 32px);
    text-align:center;
  }
  .toast.is-on{ opacity:1; transform:translateY(0); }

  @media (max-width:640px){
    .letter__stamp{ display:none; }
    .snowman{ right:-12px; opacity:.9; }
    .letter{ max-height:88dvh; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition-duration:.01ms !important; }
  }

  @media print{
    @page{ margin:18mm 16mm; }
    body{ background:#fff !important; color:#000 !important; }
    #snowfield,.grain,.moon,.treeline,.stage,.scrollwrap,.letter__close,.letter__actions,.letter__meta,.letter__stamp,.drawer,.toast{ display:none !important; }
    .overlay{
      position:static !important; opacity:1 !important; background:none !important;
      backdrop-filter:none !important; padding:0 !important; display:block !important;
    }
    .letter{
      position:static !important;
      width:100% !important; max-width:none !important; max-height:none !important;
      overflow:visible !important;
      clip-path:none !important; opacity:1 !important; transform:none !important;
      box-shadow:none !important;
      background:#fff !important;
      padding:0 !important;
      color:#000 !important;
    }
    .letter__body p,.letter__pull,.letter__sign strong{ color:#000 !important; }
    .letter__pull{ border-left-color:#999 !important; }
  }

  .noscript-note{
    max-width:540px; margin:40px auto; padding:32px;
    background:var(--paper); color:var(--ink);
    border-radius:3px; font-family:var(--serif);
    line-height:1.8; position:relative; z-index:5;
  }
  .noscript-note h1{
    font-family:var(--hand); font-size:34px; margin:0 0 20px; font-weight:600;
  }
  .noscript-note p{ margin:0 0 18px; }
</style>
</head>

  <noscript>
    <div class="noscript-note">
      <h1>Hai Nasi,</h1>
      <p>Aku nggak jago ngomong hal-hal besar. Yang keluar biasanya cuma hal receh, jadi kupindahkan semuanya ke dalam toples ini biar rapi.</p>
      <p>Tiap bintang kecil di dalamnya itu satu harapan untukmu. Ada yang soal tidurmu yang sering kurang, ada yang soal Sabtu yang semoga nggak hujan, ada juga yang cuma soal kamu pulang dengan tenang.</p>
      <p><em>Aku nggak janji bisa jadi apa-apa. Aku cuma janji nggak ke mana-mana.</em></p>
      <p style="text-align:right; font-family:Caveat,cursive; font-size:24px; margin-top:28px;">&mdash; yang masih menyimpan toplesnya</p>

  <div class="drawer" id="drawer">
    <div class="drawer__panel" role="dialog" aria-modal="true" aria-label="Tulis ulang surat">
      <div class="drawer__head">
        <div>
          <h3 class="drawer__title">Tulis ulang suratnya</h3>
          <p class="drawer__note">Tersimpan di perangkat ini saja. Penerima tidak melihat panel ini.</p>
        </div>
        <button class="drawer__close" id="drawerClose" type="button" aria-label="Tutup panel">✕</button>
      </div>

      <div class="field">
        <label for="inGreet">Sapaan</label>
        <input id="inGreet" type="text" />
      </div>

      <div class="field">
        <label for="inBody">Isi surat &mdash; pisahkan paragraf dengan satu baris kosong</label>
        <textarea id="inBody"></textarea>
      </div>

      <div class="field">
        <label for="inPull">Kalimat yang ditarik keluar</label>
        <textarea id="inPull" rows="3"></textarea>
      </div>

      <div class="field">
        <label for="inSign">Penutup</label>
        <input id="inSign" type="text" />
      </div>

      <div class="field">
        <label for="inDate">Tanggal di surat</label>
        <input id="inDate" type="text" />
      </div>

      <div class="drawer__actions">
        <button class="btn-ghost" id="soundBtn" type="button" aria-pressed="false">suara: mati</button>
        <span class="sep" aria-hidden="true"></span>
        <button class="btn-ghost" id="resetBtn" type="button">kembalikan</button>
        <span class="sep" aria-hidden="true"></span>
        <button class="btn-ghost" id="cancelBtn" type="button">batal</button>
        <span class="spacer" aria-hidden="true"></span>
        <button class="btn-primary" id="saveBtn" type="button">simpan</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

  function todayID() {
    var d = new Date();
    return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }

  var DEFAULTS = {
    greet: "Hai Nasi,",
    body:
      "Aku nggak jago ngomong hal-hal besar. Yang keluar biasanya cuma hal receh, jadi kupindahkan semuanya ke dalam toples ini biar rapi.\n\n" +
      "Tiap bintang kecil di dalamnya itu satu harapan untukmu. Ada yang soal tidurmu yang sering kurang, ada yang soal Sabtu yang semoga nggak hujan, ada juga yang cuma soal kamu pulang dengan tenang.",
    pull: "Aku nggak janji bisa jadi apa-apa. Aku cuma janji nggak ke mana-mana.",
    sign: "— yang masih menyimpan toplesnya",
    date: todayID()
  };

  var KEY = "toples-nasi-v2";

  var state = {
    greet: DEFAULTS.greet,
    body: DEFAULTS.body,
    pull: DEFAULTS.pull,
    sign: DEFAULTS.sign,
    date: DEFAULTS.date,
    opens: 0
  };

  function $(id) { return document.getElementById(id); }

  var scene = $("scene");
  var jar = $("jar");
  var hint = $("hint");
  var overlay = $("overlay");
  var scroll = $("scroll");
  var letter = $("letter");
  var drawer = $("drawer");
  var toastEl = $("toast");
  var snowfield = $("snowfield");

  var greetText = $("greetText");
  var bodyText = $("bodyText");
  var pullText = $("pullText");
  var signText = $("signText");
  var dateText = $("dateText");

  var phase = "idle";
  var soundOn = false;
  var lastFocus = null;

  function render() {
    greetText.textContent = state.greet;
    signText.textContent = state.sign;
    dateText.textContent = state.date;
    pullText.textContent = state.pull;

    bodyText.innerHTML = "";
    String(state.body).split(/\n\s*\n/).forEach(function (par) {
      if (!par.trim()) return;
      var p = document.createElement("p");
      p.textContent = par.trim();
      bodyText.appendChild(p);
    });

    renderStars();
  }

  var STAR_SLOTS = [
    [18,26],[62,16],[76,44],[32,52],[54,66],[14,70],[40,34],[86,60],[26,84],[68,80]
  ];

  function renderStars() {
    var host = $("memstars");
    if (!host) return;
    host.innerHTML = "";
    var n = Math.min(state.opens, STAR_SLOTS.length);
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      s.className = "memstar";
      s.style.left = STAR_SLOTS[i][0] + "%";
      s.style.top = STAR_SLOTS[i][1] + "%";
      s.style.animationDelay = "0s, " + (i * 0.6) + "s";
      host.appendChild(s);
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      toast("perangkat ini kehabisan ruang untuk menyimpan");
      return false;
    }
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var p = JSON.parse(raw);
      ["greet","body","pull","sign","date"].forEach(function (k) {
        if (typeof p[k] === "string" && p[k]) state[k] = p[k];
      });
      if (typeof p.opens === "number") state.opens = p.opens;
    } catch (e) { /* default */ }
  }

  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("is-on"); }, 2600);
  }

  var audioCtx = null;

  function chime(kind) {
    if (!soundOn) return;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();

      var now = audioCtx.currentTime;
      var notes = kind === "open" ? [523.25, 659.25, 783.99] : [392, 523.25];

      notes.forEach(function (freq, i) {
        var t = now + i * 0.09;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.05, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 1);
      });
    } catch (e) { /* diblokir */ }
  }

  function openJar() {
    if (phase !== "idle") return;

    lastFocus = document.activeElement;
    phase = "scroll";

    scene.classList.add("is-open");
    hint.classList.add("is-gone");
    snowfield.classList.add("is-hushed");

    state.opens = Math.min(state.opens + 1, STAR_SLOTS.length);
    save();
    renderStars();

    chime("open");
    burst();

    setTimeout(function () {
      overlay.classList.add("is-visible");
      overlay.setAttribute("aria-hidden", "false");
      scroll.focus({ preventScroll: true });
    }, 480);
  }

  function unroll() {
    if (phase !== "scroll") return;
    phase = "letter";

    overlay.classList.add("phase-letter");
    letter.setAttribute("aria-hidden", "false");
    letter.scrollTop = 0;

    setTimeout(function () {
      $("saveClose").focus({ preventScroll: true });
    }, 900);
  }

  function closeAll() {
    if (phase === "idle") return;

    overlay.classList.remove("phase-letter");

    setTimeout(function () {
      overlay.classList.remove("is-visible");
      overlay.setAttribute("aria-hidden", "true");
      letter.setAttribute("aria-hidden", "true");
      snowfield.classList.remove("is-hushed");

      setTimeout(function () {
        scene.classList.remove("is-open");
        phase = "idle";
        if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
      }, 500);
    }, 320);
  }

  jar.addEventListener("click", openJar);
  scroll.addEventListener("click", unroll);
  $("closeBtn").addEventListener("click", closeAll);
  $("saveClose").addEventListener("click", closeAll);

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closeAll();
  });

  var pressTimer = null;

  function startPress() {
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () {
      if (navigator.vibrate) navigator.vibrate(18);
      openDrawer();
    }, 900);
  }
  function endPress() { clearTimeout(pressTimer); }

  jar.addEventListener("pointerdown", startPress);
  jar.addEventListener("pointerup", endPress);
  jar.addEventListener("pointerleave", endPress);
  jar.addEventListener("pointercancel", endPress);
  jar.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "e") {
      e.preventDefault();
      openDrawer();
    }
  });

  if (/[?&]tulis=1/.test(location.search)) {
    setTimeout(openDrawer, 500);
  }

  function focusables(root) {
    return Array.prototype.slice.call(
      root.querySelectorAll('button:not([disabled]), [href], input:not([type=hidden]), textarea, select, [tabindex]:not([tabindex="-1"])')
    ).filter(function (el) {
      return el.offsetParent !== null || el === document.activeElement;
    });
  }

  document.addEventListener("keydown", function (e) {
    var layer = null;
    if (drawer.classList.contains("is-open")) layer = drawer.querySelector(".drawer__panel");
    else if (overlay.classList.contains("is-visible")) layer = (phase === "letter") ? letter : $("scrollwrap");

    if (e.key === "Escape") {
      if (drawer.classList.contains("is-open")) { closeDrawer(); return; }
      if (overlay.classList.contains("is-visible")) { closeAll(); return; }
      return;
    }

    if (e.key !== "Tab" || !layer) return;

    var list = focusables(layer);
    if (!list.length) return;

    var first = list[0];
    var last = list[list.length - 1];

    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    } else if (!layer.contains(document.activeElement)) {
      e.preventDefault();
      first.focus();
    }
  });

  function burst() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var r = jar.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height * 0.25;

    for (var i = 0; i < 14; i++) {
      (function () {
        var dot = document.createElement("span");
        var size = 2 + Math.random() * 3;
        var dx = (Math.random() - 0.5) * 150;
        var dy = -60 - Math.random() * 110;
        var dur = 900 + Math.random() * 700;

        dot.style.cssText =
          "position:fixed;left:" + cx + "px;top:" + cy + "px;" +
          "width:" + size + "px;height:" + size + "px;border-radius:50%;" +
          "background:#fff;box-shadow:0 0 10px 2px rgba(214,238,252,.9);" +
          "pointer-events:none;z-index:35;opacity:1;" +
          "transition:transform " + dur + "ms cubic-bezier(.2,.7,.3,1), opacity " + dur + "ms ease-out;";

        document.body.appendChild(dot);

        requestAnimationFrame(function () {
          dot.style.transform = "translate(" + dx + "px," + dy + "px) scale(.3)";
          dot.style.opacity = "0";
        });

        setTimeout(function () { dot.remove(); }, dur + 80);
      })();
    }
  }

  var bodyInput = $("inBody");

  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = Math.max(190, el.scrollHeight + 2) + "px";
  }

  function openDrawer() {
    $("inGreet").value = state.greet;
    bodyInput.value = state.body;
    $("inPull").value = state.pull;
    $("inSign").value = state.sign;
    $("inDate").value = state.date;

    drawer.classList.add("is-open");
    setTimeout(function () {
      autoGrow(bodyInput);
      autoGrow($("inPull"));
      $("inGreet").focus();
    }, 280);
  }

  function closeDrawer() {
    drawer.classList.remove("is-open");
    jar.focus({ preventScroll: true });
  }

  $("drawerClose").addEventListener("click", closeDrawer);
  $("cancelBtn").addEventListener("click", closeDrawer);
  drawer.addEventListener("click", function (e) {
    if (e.target === drawer) closeDrawer();
  });

  bodyInput.addEventListener("input", function () { autoGrow(bodyInput); });
  $("inPull").addEventListener("input", function () { autoGrow(this); });

  $("saveBtn").addEventListener("click", function () {
    state.greet = $("inGreet").value.trim() || DEFAULTS.greet;
    state.body = bodyInput.value.trim() || DEFAULTS.body;
    state.pull = $("inPull").value.trim();
    state.sign = $("inSign").value.trim() || DEFAULTS.sign;
    state.date = $("inDate").value.trim() || DEFAULTS.date;

    render();
    save();
    closeDrawer();
    toast("suratnya sudah diperbarui");
  });

  $("resetBtn").addEventListener("click", function () {
    if (!window.confirm("Kembalikan semua tulisan ke versi awal? Tulisan yang sekarang akan hilang.")) return;

    state.greet = DEFAULTS.greet;
    state.body = DEFAULTS.body;
    state.pull = DEFAULTS.pull;
    state.sign = DEFAULTS.sign;
    state.date = DEFAULTS.date;

    render();
    save();
    closeDrawer();
    toast("kembali ke tulisan semula");
  });

  $("soundBtn").addEventListener("click", function () {
    soundOn = !soundOn;
    this.setAttribute("aria-pressed", String(soundOn));
    this.textContent = soundOn ? "suara: nyala" : "suara: mati";
    if (soundOn) chime("open");
  });

  (function snow() {
    var canvas = snowfield;
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var flakes = [];
    var w = 0, h = 0;
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      build();
    }

    function build() {
      var count = Math.round((w * h) / 18000);
      count = Math.max(36, Math.min(count, 110));
      flakes = [];
      for (var i = 0; i < count; i++) {
        flakes.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.7 + Math.random() * 2,
          vy: 0.12 + Math.random() * 0.4,
          vx: -0.18 + Math.random() * 0.36,
          a: 0.16 + Math.random() * 0.5,
          p: Math.random() * Math.PI * 2
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < flakes.length; i++) {
        var f = flakes[i];
        ctx.beginPath();
        ctx.fillStyle = "rgba(238,246,252," + f.a + ")";
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function frame() {
      var hushed = phase !== "idle";
      var speed = hushed ? 0.05 : 1;

      for (var i = 0; i < flakes.length; i++) {
        var f = flakes[i];
        f.p += 0.007 * speed;
        f.x += (f.vx + Math.sin(f.p) * 0.26) * speed;
        f.y += f.vy * speed;

        if (f.y > h + 6) { f.y = -6; f.x = Math.random() * w; }
        if (f.x < -8) f.x = w + 8;
        if (f.x > w + 8) f.x = -8;
      }

      draw();
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();

    if (reduced) draw();
    else frame();
  })();

  load();
  render();

  if (state.opens > 0) hint.classList.add("is-gone");
})();
</script>
</body>
</html>
